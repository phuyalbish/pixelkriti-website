<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pixel Kriti - Custom Software, CRM & AI Sub-Agents</title>
    <meta
      name="description"
      content="Pixel Kriti builds custom software for businesses - CRM platforms, business operating systems, dashboards, and AI sub-agents. One system you own that turns leads into customers."
    />
    <meta name="author" content="Pixel Kriti" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="canonical" href="https://pixelkriti.com/" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pixel Kriti" />
    <meta
      property="og:title"
      content="Pixel Kriti - Custom Software, CRM & AI Sub-Agents"
    />
    <meta
      property="og:description"
      content="One system you own instead of thirty subscriptions you rent. Custom CRM platforms, business operating systems, and AI agents that turn leads into customers."
    />
    <meta property="og:url" content="https://pixelkriti.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Structured data for rich search results. One document serves every
      route of this SPA, so both blocks ship globally: Organization describes
      the company, LocalBusiness adds the contact/locale details Google wants
      for the home and contact listings.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Pixel Kriti",
        "description": "Custom software company building CRM platforms, business operating systems, dashboards, and AI sub-agents - one system a business owns instead of dozens of rented subscriptions.",
        "url": "https://pixelkriti.com/",
        "email": "info@pixelkriti.com",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Sales",
          "email": "info@pixelkriti.com"
        },
        "sameAs": ["https://www.linkedin.com/company/pixel-kriti"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Pixel Kriti",
        "description": "Custom CRM platforms, business operating systems, analytics, and AI sub-agents built for small and mid-sized businesses.",
        "url": "https://pixelkriti.com/",
        "email": "info@pixelkriti.com",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "Nepal"
        },
        "openingHours": "Mo-Fr 09:00-17:00"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking render: `media="print"` keeps the stylesheet out
      of the critical path, then onload flips it live. Text paints immediately
      in the fallback stack and swaps when the webfonts arrive (display=swap).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300..700&family=Montserrat:wght@200..600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300..700&family=Montserrat:wght@200..600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Fallback for clients that never run JavaScript (and the floor for
      non-rendering crawlers on any route the prerender step misses).
    -->
    <noscript>
      <main style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #f2f2f0; background: #0b0b0c">
        <h1>Pixel Kriti</h1>
        <p>
          Custom software your business runs on - CRM platforms, business
          operating systems, dashboards, and AI sub-agents. One system you
          own, built to turn leads into customers.
        </p>
        <ul>
          <li><a href="/services">Services</a></li>
          <li><a href="/work">Case studies</a></li>
          <li><a href="/about">About the team</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
        <p>This site works best with JavaScript enabled.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
